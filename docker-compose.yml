# Запуск: cp .env.example .env && docker compose up -d --build
# Секреты берутся ТОЛЬКО из .env (в git не попадает).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - avatar_data:/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    # Тот же IPv6-баг, что чинили для apt-get в Dockerfile, но теперь для
    # рантайм-сети контейнера: без этого скачивание весов моделей с GitHub
    # (InsightFace) может зависать на много минут вместо секунд.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - avatar_data:/data      # общий том с api: входные/выходные изображения
      - models_cache:/models   # кэш весов (InsightFace, u2net, HuggingFace)
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true

volumes:
  pgdata:
  avatar_data:
  models_cache: